<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendário de Conteúdo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: organizado, de estúdio, direto — uma ferramenta de trabalho diário
   IDEA: o planner de parede do social media, com miniaturas presas em cada dia
   PICTURE: a própria grade do mês, com as artes e vídeos visíveis nos dias
   COLOUR and TYPE: faixa coral #e8432f, tinta #17161b, acento amarelo-sol para hoje; Archivo 800 + Inter
   LAYOUT: barra de controle no topo, visão (calendário/status/lista) ocupando a tela, ficha do post em painel */
:root,:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark;
--bg:#000;--ink:#f3f2f5;--mute:#9e9ba6;
--line:#2a2930;--soft:#121115;--card:#18171c;
--red:#e8432f;--redd:#ff6a55;--sun:#ffd23f;
--ig:#d62976;--fb:#1877f2;--tt:#25f4ee;--yt:#ff0000}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;margin:0;line-height:1.05;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{background:#000;color:#fff;border-bottom:1px solid var(--line);padding:20px max(4vw,16px) 0}
.top-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.top h1{font-size:clamp(26px,4vw,40px);font-weight:800}
.month{display:flex;align-items:center;gap:6px}
.month h2{font-size:22px;font-weight:600;min-width:9.5em;text-align:center;text-transform:capitalize}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:#fff;font-size:20px}
.ib:hover{background:#fff2}
.new{height:44px;padding:0 20px;border-radius:22px;border:0;background:var(--red);color:#fff;font-weight:600}
.tabs{display:flex;gap:4px;margin-top:18px;overflow-x:auto}
.tabs a{flex:none;padding:10px 18px;border-radius:12px 12px 0 0;color:#fff;text-decoration:none;font-weight:600}
.tabs a{color:var(--mute)}.tabs a[aria-current]{background:var(--soft);color:#fff;box-shadow:inset 0 -3px 0 var(--red)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px max(4vw,16px);border-bottom:1px solid var(--line)}
.bar select,.bar input{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;font-size:16px}
.bar input{flex:1 1 180px}
.stats{display:flex;gap:18px;margin-left:auto;font-size:14px;color:var(--mute)}
.stats b{font:800 22px Archivo,sans-serif;color:var(--ink);margin-right:4px}
.stats .late b{color:var(--redd)}
.note{margin:12px max(4vw,16px) 0;padding:10px 14px;border-radius:10px;background:var(--soft);font-size:14px;color:var(--mute)}
main{padding:16px max(4vw,16px) 48px}
/* calendário */
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{font-size:13px;color:var(--mute);padding:4px 8px;font-weight:600}
.grid{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.day{min-height:132px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.day.out{background:var(--soft)}.day.out .num{opacity:.45}
.day.drop{background:#3a3218}
.num{font-size:13px;font-weight:600;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.today .num{background:var(--sun);color:#17161b}
.chip{display:flex;gap:6px;align-items:center;padding:4px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:13px;line-height:1.2;cursor:grab;text-align:left;width:100%}
.chip:hover{border-color:var(--mute)}
.th{flex:none;width:34px;height:34px;border-radius:6px;background:var(--soft);object-fit:cover;display:grid;place-items:center;font-size:11px;color:var(--mute);overflow:hidden}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.chip .m{font-size:11px;color:var(--mute);display:flex;gap:3px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.d-ig{background:var(--ig)}.d-fb{background:var(--fb)}.d-tt{background:var(--tt)}.d-yt{background:var(--yt)}
.more{font-size:12px;color:var(--mute);padding-left:4px}
.st{width:4px;align-self:stretch;border-radius:2px;flex:none}
.s-ideia{background:#b9b5c0}.s-producao{background:#f2b705}.s-aprovacao{background:#ff8a3d}.s-agendado{background:#5b7cfa}.s-publicado{background:#22a565}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--soft);border-radius:14px;padding:10px;min-height:300px}
.col h3{font-size:16px;display:flex;align-items:center;gap:8px;padding:4px 4px 10px}
.col h3 .st{width:10px;height:10px;align-self:center;border-radius:50%}
.col h3 span.c{margin-left:auto;font:500 13px Inter;color:var(--mute)}
.col.drop{outline:2px dashed var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;cursor:grab;display:block;width:100%;text-align:left;padding:0}
.card .cv{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;color:var(--mute);font-size:13px;overflow:hidden}
.card .cv img,.card .cv video{width:100%;height:100%;object-fit:cover}
.card .cb{padding:10px 12px}
.card .t{font-weight:600;font-size:15px;line-height:1.3}
.card .m{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
/* lista */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:72px 110px minmax(0,1fr) auto;gap:14px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.row .th{width:72px;height:72px;border-radius:8px}
.row .dt{font:800 18px Archivo,sans-serif;white-space:nowrap}.row .dt small{display:block;font:500 13px Inter;color:var(--mute)}
.row .t{font-weight:600}.row .m{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--soft);white-space:nowrap}
.empty{padding:48px 16px;text-align:center;color:var(--mute)}
.empty h3{color:var(--ink);font-size:24px;margin-bottom:8px}
/* ficha */
.ov{position:fixed;inset:0;background:#0008;display:none;justify-content:flex-end;z-index:10}
.ov.on{display:flex}
.panel{width:min(560px,100%);height:100%;overflow-y:auto;background:var(--bg);padding:22px 24px 40px;box-shadow:-10px 0 40px #0004}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.ph h2{font-size:26px}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px}
.f{display:grid;gap:4px;margin-bottom:14px}
.f label,.f .lb{font-size:13px;font-weight:600;color:var(--mute)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;font-size:16px;width:100%}
.f textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nets{display:flex;flex-wrap:wrap;gap:8px}
.nets label{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:22px;cursor:pointer;font-size:15px;color:var(--ink);min-height:44px}
.nets input{width:18px;height:18px;accent-color:var(--red)}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.mi{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft)}
.mi img,.mi video{width:100%;height:100%;object-fit:cover}
.mi button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:#000a;color:#fff}
.mi img{cursor:zoom-in}.mi .zm{left:4px;right:auto;font-size:15px}
.lb{position:fixed;inset:0;background:#000e;z-index:20;display:none;align-items:center;justify-content:center;padding:56px 64px}
.lb.on{display:flex}
.lb img,.lb video{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb button{position:absolute;width:48px;height:48px;border-radius:50%;border:1px solid #fff4;background:#0008;color:#fff;font-size:24px}
.lb .lx{top:12px;right:12px}.lb .lp{left:10px;top:50%;transform:translateY(-50%)}.lb .ln{right:10px;top:50%;transform:translateY(-50%)}
.lb .lc{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#ccc;font-size:14px}
@media(max-width:600px){.lb{padding:60px 8px}.lb .lp,.lb .ln{top:auto;bottom:8px;transform:none}}
.up{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--mute);cursor:pointer;padding:6px}
.up:hover{border-color:var(--red);color:var(--red)}
.msg{font-size:13px;color:var(--mute);margin-top:6px;min-height:1em}
.lnk{font-size:14px;color:var(--redd);word-break:break-all}
.cp{border:0;background:none;color:var(--redd);font-size:13px;font-weight:600;padding:0;justify-self:end}
.act{display:flex;gap:10px;justify-content:space-between;margin-top:20px;position:sticky;bottom:-40px;background:var(--bg);padding:12px 0}
.btn{height:46px;padding:0 22px;border-radius:23px;border:0;background:var(--red);color:#fff;font-weight:600}
.btn.gh{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.del{background:transparent;color:var(--redd);border:1px solid currentColor}
@media(max-width:760px){.day{min-height:84px;padding:3px}.chip .t,.chip .m{display:none}.chip{padding:2px;justify-content:center}.th{width:100%;height:30px}
.row{grid-template-columns:56px minmax(0,1fr)}.row .th{width:56px;height:56px}.row .dt{grid-column:2;font-size:15px}.row .tx{grid-column:1/-1}.row .pill{grid-column:1/-1;justify-self:start}
.stats{margin-left:0;width:100%}.two{grid-template-columns:1fr}.month h2{min-width:0;font-size:18px}}
@media(prefers-reduced-motion:no-preference){.panel{animation:sl .22s ease-out}@keyframes sl{from{transform:translateX(40px);opacity:0}}}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>Calendário de conteúdo</h1>
    <div class="month">
      <button class="ib" id="prev" aria-label="Mês anterior">‹</button>
      <h2 id="mlabel"></h2>
      <button class="ib" id="next" aria-label="Próximo mês">›</button>
    </div>
    <div style="display:flex;gap:10px;align-items:center"><button class="new" id="newBtn">+ Novo post</button><a href="/logout" style="color:#9e9ba6;font-size:14px;padding:10px">Sair</a></div>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#calendario">Calendário</a><a href="#status">Por status</a><a href="#lista">Lista</a>
  </nav>
</header>
<div class="bar">
  <select id="fRede" aria-label="Filtrar por rede"><option value="">Todas as redes</option></select>
  <select id="fMarca" aria-label="Filtrar por marca"><option value="">Todas as marcas</option></select>
  <input id="fBusca" type="search" placeholder="Buscar tema, legenda, hashtag…" aria-label="Buscar">
  <div class="stats" id="stats"></div>
</div>
<div class="note" id="note">Carregando seus posts…</div>
<main id="view"></main>

<div class="ov" id="ov">
  <form class="panel" id="form" autocomplete="off">
    <div class="ph"><h2 id="ftitle">Novo post</h2><button type="button" class="x" id="close" aria-label="Fechar">×</button></div>
    <div class="f"><label for="titulo">Tema / título</label><input id="titulo" required placeholder="Ex.: Lançamento linha verão"></div>
    <div class="two">
      <div class="f"><label for="data">Data de postagem</label><input id="data" type="date" required></div>
      <div class="f"><label for="hora">Horário</label><input id="hora" type="time"></div>
    </div>
    <div class="f"><span class="lb">Redes</span><div class="nets" id="nets"></div></div>
    <div class="two">
      <div class="f"><label for="formato">Formato</label><select id="formato"></select></div>
      <div class="f"><label for="status">Status</label><select id="status"></select></div>
    </div>
    <div class="f"><label for="marca">Marca / cliente</label><input id="marca" list="marcas" placeholder="Ex.: Solo"><datalist id="marcas"></datalist></div>
    <div class="f"><span class="lb">Imagens e vídeos</span>
      <div class="media" id="media"></div>
      <input type="file" id="file" accept="image/*,video/*" multiple hidden>
      <div class="msg" id="umsg"></div>
    </div>
    <div class="f"><label for="legenda">Legenda / roteiro</label><textarea id="legenda" placeholder="Texto do post, roteiro do vídeo, CTA…"></textarea><button type="button" class="cp" id="copyLeg">Copiar legenda</button></div>
    <div class="f"><label for="hashtags">Hashtags</label><input id="hashtags" placeholder="#moda #verao"></div>
    <div class="f"><label for="link">Link (Canva, Drive, vídeo publicado)</label><input id="link" type="url" placeholder="https://"><a class="lnk" id="linkOpen" target="_blank" rel="noopener" hidden>Abrir link</a></div>
    <div class="f"><label for="notas">Anotações</label><textarea id="notas" style="min-height:70px" placeholder="Referências, música, ajustes pendentes…"></textarea></div>
    <div class="act"><button type="button" class="btn del" id="del" hidden>Excluir</button><span></span><button type="submit" class="btn" id="save">Salvar</button></div>
  </form>
</div>

<div class="lb" id="lb" role="dialog" aria-label="Mídia ampliada"><div id="lbBody" style="display:contents"></div><button type="button" class="lx" id="lbX" aria-label="Fechar">×</button><button type="button" class="lp" id="lbP" aria-label="Anterior">‹</button><button type="button" class="ln" id="lbN" aria-label="Próxima">›</button><div class="lc" id="lbC"></div></div>
<script>
{
const REDES=[["ig","Instagram"],["fb","Facebook"],["tt","TikTok"],["yt","YouTube"]];
const FORMATOS=["Feed (imagem)","Carrossel","Reels","Story","TikTok vídeo","YouTube Shorts","YouTube vídeo longo","Live"];
const STATUS=[["ideia","Ideia"],["producao","Em produção"],["aprovacao","Revisão"],["agendado","Agendado"],["publicado","Publicado"]];
const SL=Object.fromEntries(STATUS),RL=Object.fromEntries(REDES);
const MARCAS_FIXAS=["SOLO"];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const TODAY=iso(new Date());
let posts=[],cur=new Date(),assets=true,local=false,canWrite=true,editing=null,media=[],delArm=false;
cur.setDate(1);

const blobUrl=m=>"/media/"+encodeURIComponent(m.id);
const thumb=(p,cls="th")=>{const m=(p.midias||[])[0];
  if(!m)return `<span class="${cls}">${esc((p.formato||"").split(" ")[0].slice(0,5))}</span>`;
  return m.type==="video"?`<video class="${cls}" src="${blobUrl(m)}#t=0.5" muted preload="metadata"></video>`:`<img class="${cls}" src="${blobUrl(m)}" alt="" loading="lazy">`};
const dots=p=>(p.redes||[]).filter(r=>RL[r]).map(r=>`<span class="dot d-${r}" title="${RL[r]}"></span>`).join("");
const fmtDate=s=>{if(!s)return"";const[y,m,d]=s.split("-");return `${d}/${m}`};
const dow=s=>["dom","seg","ter","qua","qui","sex","sáb"][new Date(s+"T12:00").getDay()];

function filtered(){const r=$("#fRede").value,mk=$("#fMarca").value,q=$("#fBusca").value.trim().toLowerCase();
  return posts.filter(p=>(!r||(p.redes||[]).includes(r))&&(!mk||p.marca===mk)&&(!q||[p.titulo,p.legenda,p.hashtags,p.notas,p.marca].join(" ").toLowerCase().includes(q)))}

function fillSelects(){
  $("#fRede").insertAdjacentHTML("beforeend",REDES.map(([k,v])=>`<option value="${k}">${v}</option>`).join(""));
  $("#nets").innerHTML=REDES.map(([k,v])=>`<label><input type="checkbox" value="${k}"><span class="dot d-${k}"></span>${v}</label>`).join("");
  $("#formato").innerHTML=FORMATOS.map(f=>`<option>${f}</option>`).join("");
  $("#status").innerHTML=STATUS.map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
}
function refreshMarcas(){const ms=[...new Set([...MARCAS_FIXAS,...posts.map(p=>p.marca).filter(Boolean)])].sort();
  const sel=$("#fMarca"),v=sel.value;
  sel.innerHTML=`<option value="">Todas as marcas</option>`+ms.map(m=>`<option>${esc(m)}</option>`).join("");sel.value=ms.includes(v)?v:"";
  $("#marcas").innerHTML=ms.map(m=>`<option value="${esc(m)}">`).join("")}

function stats(list){const pre=iso(cur).slice(0,7);const inM=list.filter(p=>(p.data||"").startsWith(pre));
  const pub=inM.filter(p=>p.status==="publicado").length;
  const late=list.filter(p=>p.data&&p.data<TODAY&&p.status!=="publicado").length;
  $("#stats").innerHTML=`<span><b>${inM.length}</b>no mês</span><span><b>${pub}</b>publicados</span><span><b>${inM.length-pub}</b>a fazer</span>`+(late?`<span class="late"><b>${late}</b>atrasados</span>`:"")}

function viewName(){const h=location.hash.slice(1);return ["calendario","status","lista"].includes(h)?h:"calendario"}
function render(){
  const v=viewName(),list=filtered();
  document.querySelectorAll("#tabs a").forEach(a=>a.toggleAttribute("aria-current",a.getAttribute("href")==="#"+v));
  $("#mlabel").textContent=MESES[cur.getMonth()]+" "+cur.getFullYear();
  stats(list);
  if(v==="calendario")renderCal(list);else if(v==="status")renderBoard(list);else renderList(list);
}
function renderCal(list){
  const start=new Date(cur);start.setDate(1-start.getDay());
  const by={};list.forEach(p=>(by[p.data]=by[p.data]||[]).push(p));
  let h=`<div class="dow">${["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(d=>`<div>${d}</div>`).join("")}</div><div class="grid">`;
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);
    if(i===35&&d.getMonth()!==cur.getMonth())break;
    const ps=(by[k]||[]).sort((a,b)=>(a.hora||"").localeCompare(b.hora||""));
    h+=`<div class="day${d.getMonth()!==cur.getMonth()?" out":""}${k===TODAY?" today":""}" data-day="${k}"><span class="num">${d.getDate()}</span>`+
      ps.slice(0,3).map(p=>`<button type="button" class="chip" draggable="${canWrite}" data-id="${esc(p.id)}"><span class="st s-${esc(p.status)}"></span>${thumb(p)}<span><span class="t">${esc(p.titulo)}</span><span class="m">${dots(p)} ${esc(p.hora||"")} ${esc((p.formato||"").split(" (")[0])}</span></span></button>`).join("")+
      (ps.length>3?`<span class="more">+${ps.length-3} posts</span>`:"")+`</div>`}
  $("#view").innerHTML=h+"</div>"+(posts.length?"":emptyMsg());
}
function renderBoard(list){
  const sorted=[...list].sort((a,b)=>(a.data||"").localeCompare(b.data||""));
  $("#view").innerHTML=`<div class="board">`+STATUS.map(([k,v])=>{const ps=sorted.filter(p=>(p.status||"ideia")===k);
    return `<section class="col" data-status="${k}"><h3><span class="st s-${k}"></span>${v}<span class="c">${ps.length}</span></h3>`+
    ps.map(p=>`<button type="button" class="card" draggable="${canWrite}" data-id="${esc(p.id)}"><div class="cv">${thumb(p,"")}</div><div class="cb"><div class="t">${esc(p.titulo)}</div><div class="m">${dots(p)}<span>${fmtDate(p.data)} ${esc(p.hora||"")}</span><span>· ${esc(p.formato||"")}</span></div></div></button>`).join("")+`</section>`}).join("")+`</div>`+(posts.length?"":emptyMsg());
}
function renderList(list){
  const sorted=[...list].sort((a,b)=>((a.data||"")+(a.hora||"")).localeCompare((b.data||"")+(b.hora||"")));
  const up=sorted.filter(p=>p.data>=TODAY),past=sorted.filter(p=>!(p.data>=TODAY)).reverse();
  const row=p=>`<button type="button" class="row" data-id="${esc(p.id)}">${thumb(p)}<span class="dt">${fmtDate(p.data)}<small>${dow(p.data)} ${esc(p.hora||"")}</small></span><span class="tx"><span class="t">${esc(p.titulo)}</span><span class="m">${dots(p)} ${esc(p.formato||"")}${p.marca?" · "+esc(p.marca):""}</span></span><span class="pill"><span class="dot s-${esc(p.status)}"></span> ${esc(SL[p.status]||"Ideia")}</span></button>`;
  $("#view").innerHTML=(up.length?`<h3 style="margin:4px 0 12px">Próximos</h3><div class="list">${up.map(row).join("")}</div>`:"")+
    (past.length?`<h3 style="margin:28px 0 12px">Anteriores</h3><div class="list">${past.map(row).join("")}</div>`:"")+(sorted.length?"":emptyMsg());
}
const emptyMsg=()=>`<div class="empty"><h3>Seu calendário está vazio</h3><p>Clique em um dia do calendário ou em “+ Novo post” para planejar o primeiro conteúdo.</p></div>`;

/* ficha */
function openForm(p,day){
  editing=p?p.id:null;delArm=false;
  $("#ftitle").textContent=p?"Editar post":"Novo post";
  $("#titulo").value=p?.titulo||"";$("#data").value=p?.data||day||TODAY;$("#hora").value=p?.hora||"";
  $("#formato").value=p?.formato||FORMATOS[0];$("#status").value=p?.status||"ideia";$("#marca").value=p?p.marca||"":($("#fMarca").value||"SOLO");
  $("#legenda").value=p?.legenda||"";$("#hashtags").value=p?.hashtags||"";$("#link").value=p?.link||"";$("#notas").value=p?.notas||"";
  document.querySelectorAll("#nets input").forEach(i=>i.checked=(p?.redes||[]).includes(i.value));
  media=[...(p?.midias||[])];renderMedia();updLink();$("#umsg").textContent="";
  $("#del").hidden=!p||!canWrite;$("#del").textContent="Excluir";$("#save").hidden=!canWrite;
  $("#form").querySelectorAll("input,select,textarea").forEach(e=>e.disabled=!canWrite);
  $("#ov").classList.add("on");setTimeout(()=>$("#titulo").focus(),50);
}
function closeForm(){$("#ov").classList.remove("on");editing=null}
function renderMedia(){
  $("#media").innerHTML=media.map((m,i)=>`<div class="mi">${m.type==="video"?`<video src="${blobUrl(m)}" controls muted preload="metadata"></video><button type="button" class="zm" data-view="${i}" aria-label="Ampliar vídeo">⤢</button>`:`<img src="${blobUrl(m)}" alt="${esc(m.name)}" data-view="${i}">`}${canWrite?`<button type="button" data-rm="${i}" aria-label="Remover">×</button>`:""}</div>`).join("")+
    (canWrite&&assets?`<div class="up" id="upBtn" role="button" tabindex="0">+ Adicionar imagem ou vídeo</div>`:"");
  if(canWrite&&!assets)$("#umsg").textContent=local?"Upload de mídia indisponível neste modo — use o campo Link.":"";
}
function updLink(){const v=$("#link").value.trim(),a=$("#linkOpen");if(/^https:\/\//i.test(v)){a.href=v;a.hidden=false}else a.hidden=true}

async function upload(files){
  for(const f of files){
    if(f.size>95*1024*1024){$("#umsg").textContent=`“${f.name}” passa de 95 MB. Para vídeos maiores, cole o link do Drive ou YouTube no campo Link.`;continue}
    $("#umsg").textContent=`Enviando ${f.name}…`;
    try{const res=await fetch("/api/media",{method:"POST",headers:{"Content-Type":f.type||"application/octet-stream","X-Filename":encodeURIComponent(f.name)},body:f});
      if(res.status===401){location.href="/login";return}if(!res.ok)throw 0;const r=await res.json();media.push({id:r.id,type:f.type.startsWith("video")?"video":"image",name:f.name});renderMedia();$("#umsg").textContent="Mídia adicionada. Lembre de salvar."}
    catch(e){$("#umsg").textContent="Não foi possível enviar "+f.name+"."}
  }
}

function readForm(){return{titulo:$("#titulo").value.trim(),data:$("#data").value,hora:$("#hora").value,
  redes:[...document.querySelectorAll("#nets input:checked")].map(i=>i.value),formato:$("#formato").value,status:$("#status").value,
  marca:$("#marca").value.trim(),legenda:$("#legenda").value,hashtags:$("#hashtags").value.trim(),link:$("#link").value.trim(),
  notas:$("#notas").value,midias:media,atualizado:Date.now()}}

const novoId=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
async function api(url,opt){const r=await fetch(url,opt);if(r.status===401){location.href="/login";throw{code:"auth"}}if(!r.ok)throw{code:r.status};return r.json()}
async function savePost(id,data){const {id:_,...body}=data;id=id||novoId();
  await api("/api/posts/"+encodeURIComponent(id),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const i=posts.findIndex(p=>p.id===id);if(i>=0)posts[i]={...body,id};else posts.push({...body,id});refreshMarcas();render()}
async function removePost(id){await api("/api/posts/"+encodeURIComponent(id),{method:"DELETE"});posts=posts.filter(p=>p.id!==id);render()}
function writeErr(e){if(e?.code==="auth")return;$("#note").hidden=false;$("#note").textContent="Não foi possível salvar agora. Verifique a conexão e tente de novo.";$("#umsg").textContent="Não foi possível salvar agora. Tente de novo em instantes."}

$("#form").addEventListener("submit",async e=>{e.preventDefault();if(!canWrite)return;const d=readForm();if(!d.titulo||!d.data)return;
  $("#save").disabled=true;try{const old=posts.find(p=>p.id===editing);await savePost(editing,old?{...old,...d}:{...d,criado:Date.now()});closeForm()}catch(err){writeErr(err)}$("#save").disabled=false});
$("#del").addEventListener("click",async()=>{if(!delArm){delArm=true;$("#del").textContent="Confirmar exclusão";return}
  try{await removePost(editing);closeForm()}catch(err){writeErr(err)}});
$("#close").addEventListener("click",closeForm);
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeForm()});
document.addEventListener("keydown",e=>{if($("#lb").classList.contains("on")){if(e.key==="Escape")closeLb();else if(e.key==="ArrowLeft")showLb(lbI-1);else if(e.key==="ArrowRight")showLb(lbI+1);return}if(e.key==="Escape"&&$("#ov").classList.contains("on"))closeForm()});
let lbI=0;
function showLb(i){if(!media.length)return;lbI=(i+media.length)%media.length;const m=media[lbI];
  $("#lbBody").innerHTML=m.type==="video"?`<video src="${blobUrl(m)}" controls autoplay playsinline></video>`:`<img src="${blobUrl(m)}" alt="${esc(m.name)}">`;
  $("#lbC").textContent=(media.length>1?(lbI+1)+" de "+media.length+" · ":"")+(m.name||"");
  $("#lbP").hidden=$("#lbN").hidden=media.length<2;$("#lb").classList.add("on")}
function closeLb(){$("#lb").classList.remove("on");$("#lbBody").innerHTML=""}
$("#lbX").addEventListener("click",closeLb);$("#lbP").addEventListener("click",()=>showLb(lbI-1));$("#lbN").addEventListener("click",()=>showLb(lbI+1));
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")closeLb()});
$("#media").addEventListener("click",e=>{const vw=e.target.closest("[data-view]");if(vw){showLb(+vw.dataset.view);return}const rm=e.target.closest("[data-rm]");if(rm){media.splice(+rm.dataset.rm,1);renderMedia();return}if(e.target.closest("#upBtn"))$("#file").click()});
$("#media").addEventListener("keydown",e=>{if(e.target.id==="upBtn"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();$("#file").click()}});
$("#file").addEventListener("change",e=>{upload([...e.target.files]);e.target.value=""});
$("#link").addEventListener("input",updLink);
$("#copyLeg").addEventListener("click",async()=>{const t=[$("#legenda").value,$("#hashtags").value].filter(Boolean).join("\n\n");
  try{await navigator.clipboard.writeText(t);$("#copyLeg").textContent="Copiado!"}catch(e){$("#legenda").select();$("#copyLeg").textContent="Selecionado — use Ctrl+C"}setTimeout(()=>$("#copyLeg").textContent="Copiar legenda",1800)});

/* navegação e cliques */
$("#prev").addEventListener("click",()=>{cur.setMonth(cur.getMonth()-1);render()});
$("#next").addEventListener("click",()=>{cur.setMonth(cur.getMonth()+1);render()});
$("#newBtn").addEventListener("click",()=>canWrite&&openForm(null));
["fRede","fMarca","fBusca"].forEach(id=>$("#"+id).addEventListener("input",render));
window.addEventListener("hashchange",render);
$("#view").addEventListener("click",e=>{const it=e.target.closest("[data-id]");if(it){openForm(posts.find(p=>p.id===it.dataset.id));return}
  const day=e.target.closest("[data-day]");if(day&&canWrite)openForm(null,day.dataset.day)});

/* arrastar: muda data (calendário) ou status (quadro) */
let dragId=null;
$("#view").addEventListener("dragstart",e=>{const it=e.target.closest("[data-id]");if(!it||!canWrite)return;dragId=it.dataset.id;e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
$("#view").addEventListener("dragover",e=>{const t=e.target.closest("[data-day],[data-status]");if(!t||!dragId)return;e.preventDefault();
  document.querySelectorAll(".drop").forEach(x=>x!==t&&x.classList.remove("drop"));t.classList.add("drop")});
$("#view").addEventListener("dragleave",e=>{const t=e.target.closest(".drop");if(t&&!t.contains(e.relatedTarget))t.classList.remove("drop")});
$("#view").addEventListener("drop",async e=>{const t=e.target.closest("[data-day],[data-status]");document.querySelectorAll(".drop").forEach(x=>x.classList.remove("drop"));
  if(!t||!dragId)return;e.preventDefault();const p=posts.find(x=>x.id===dragId);dragId=null;if(!p)return;
  const ch=t.dataset.day?{data:t.dataset.day}:{status:t.dataset.status};if(Object.entries(ch).every(([k,v])=>p[k]===v))return;
  try{await savePost(p.id,{...p,...ch,atualizado:Date.now()})}catch(err){writeErr(err)}});
$("#view").addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".drop").forEach(x=>x.classList.remove("drop"))});

/* dados */
fillSelects();refreshMarcas();render();
(async()=>{try{posts=await api("/api/posts");$("#note").hidden=true;refreshMarcas();render()}
  catch(e){if(e?.code!=="auth")$("#note").textContent="Não foi possível carregar os posts. Verifique a conexão e recarregue a página."}})();
}
</script>
</body>
</html>
